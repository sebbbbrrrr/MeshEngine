name: Neural CPU benchmark
on:
  pull_request:
    paths:
      - 'neural/**'
      - '.github/workflows/neural-benchmark.yml'
permissions:
  contents: read
jobs:
  generic-cube:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU runtime
        run: |
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 Pillow==10.1.0 omegaconf==2.3.0 einops==0.7.0 transformers==4.40.2 tokenizers==0.19.1 trimesh==4.0.5 huggingface-hub==0.25.2 scipy==1.13.1 scikit-image==0.24.0 imageio==2.34.2 rembg==2.0.57 onnxruntime==1.18.1 opencv-python-headless==4.10.0.84
          git clone https://github.com/VAST-AI-Research/TripoSR.git /tmp/triposr
          git -C /tmp/triposr checkout 107cefdc244c39106fa830359024f6a2f1c78871
          # CPU marching cubes adapter; upstream expects Z,Y,X vertex order.
          cat > /tmp/triposr/torchmcubes.py <<'PY'
          import torch
          from skimage.measure import marching_cubes as mc
          def marching_cubes(volume, level):
              v, f, _, _ = mc(volume.detach().cpu().numpy(), level=level, gradient_direction="descent")
              return torch.from_numpy(v[:, ::-1].copy()), torch.from_numpy(f.copy()).long()
          PY
      - name: Fetch pretrained checkpoint
        run: |
          huggingface-cli download stabilityai/TripoSR config.yaml model.ckpt --local-dir /tmp/triposr-weights
      - name: Generate generic fixture and reconstruct
        run: |
          python neural/fixture.py /tmp/fixture.png
          PYTHONPATH=/tmp/triposr python neural/reconstruct.py /tmp/fixture.png --weights /tmp/triposr-weights --output neural-result --resolution 128
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generic-neural-cpu
          path: neural-result/
          if-no-files-found: error
          retention-days: 7
